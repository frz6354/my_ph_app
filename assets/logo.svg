<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- White background -->
  <rect width="512" height="512" rx="64" ry="64" fill="#ffffff"/>

  <!-- Dark blue circle accent -->
  <circle cx="256" cy="256" r="200" fill="#0D1B6F"/>

  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1A2FA0" stroke-width="2" opacity="0.5"/>

  <!-- "F" letter -->
  <text
    x="200"
    y="310"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="180"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-8"
  >F</text>

  <!-- "Z" letter -->
  <text
    x="320"
    y="310"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="180"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-8"
  >Z</text>

  <!-- Decorative underline accent -->
  <line x1="140" y1="340" x2="372" y2="340" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
</svg>
